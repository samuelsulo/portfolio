version: 2
updates:
  - package-ecosystem: npm
    directory: /application
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(application)"
    ignore:
      # typescript-eslint supports TypeScript up to 6.0 (its tracking issue:
      # typescript-eslint/typescript-eslint#10940). Drop this when it
      # supports 7.x and lint:check passes with it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(repo)"
