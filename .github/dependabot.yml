version: 2
updates:
  - package-ecosystem: npm
    directory: /application
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(application)"
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(repo)"
