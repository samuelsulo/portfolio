commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

pre-commit:
  commands:
    infrastructure-fmt-tofu:
      root: "infrastructure/"
      glob: "infrastructure/**/*.{tf,tfvars}"
      run: mise exec -- tofu fmt {staged_files}
      stage_fixed: true
    infrastructure-fmt-hcl:
      root: "infrastructure/"
      glob: "infrastructure/**/*.hcl"
      run: mise exec -- terragrunt hcl fmt
      stage_fixed: true
    infrastructure-lint:
      root: "infrastructure/"
      glob: "infrastructure/**/*.{tf,tfvars,hcl}"
      run: mise run lint
    web-lint:
      root: "apps/web/"
      glob: "apps/web/**/*.{ts,vue,js,cjs,mjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    web-format:
      root: "apps/web/"
      glob: "apps/web/**/*.{ts,vue,css,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    web-type-check:
      root: "apps/web/"
      glob: "apps/web/**/*.{ts,vue}"
      run: npm run type-check

pre-push:
  commands:
    conventional-commits:
      run: cog check
