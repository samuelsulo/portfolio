commit-msg:
  commands:
    conventional-commit:
      run: cog verify --file {1}

pre-commit:
  commands:
    infrastructure-fmt-tofu:
      root: "infrastructure/"
      glob: "infrastructure/**/*.{tf,tfvars}"
      run: mise exec -- tofu fmt {staged_files}
      stage_fixed: true
    infrastructure-fmt-hcl:
      root: "infrastructure/"
      glob: "infrastructure/**/*.hcl"
      run: mise exec -- terragrunt hcl fmt
      stage_fixed: true
    application-lint:
      root: "application/"
      glob: "application/**/*.{ts,vue,js,cjs,mjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
    application-format:
      root: "application/"
      glob: "application/**/*.{ts,vue,css,json}"
      run: npx prettier --write {staged_files}
      stage_fixed: true
    application-type-check:
      root: "application/"
      glob: "application/**/*.{ts,vue}"
      run: npm run type-check

pre-push:
  commands:
    conventional-commits:
      run: cog check
