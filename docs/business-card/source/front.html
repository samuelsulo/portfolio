<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Business card - front</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .front__mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 11mm;
    height: 11mm;
    border-radius: var(--radius-full);
    border: 0.28mm solid var(--color-neon-primary);
    box-shadow: var(--glow-primary);
    background: rgba(var(--color-neon-primary-rgb), 0.06);
  }

  .front__mark svg {
    width: 7.4mm;
    height: 7.4mm;
  }

  .front__content {
    flex-direction: column;
    justify-content: space-between;
  }

  .front__identity {
    display: flex;
    flex-direction: column;
    gap: 2mm;
    padding-bottom: 1.5mm;
  }

  .front__name {
    font-size: 6.4mm;
    font-weight: 700;
    letter-spacing: -0.01em;
    line-height: 1.05;
    color: var(--color-text);
  }

  .front__role {
    display: flex;
    align-items: center;
    gap: 2.2mm;
  }

  .front__role-bar {
    width: 0.7mm;
    height: 3.6mm;
    border-radius: var(--radius-full);
    background: var(--color-neon-primary);
    box-shadow: 0 0 2.4mm rgba(var(--color-neon-primary-rgb), 0.75);
    flex-shrink: 0;
  }

  .front__role-text {
    font-family: var(--font-sans);
    font-weight: 500;
    font-size: 3mm;
    color: var(--color-text-muted);
  }

  .front__watermark {
    position: absolute;
    bottom: 1.5mm;
    right: 0;
    font-family: var(--font-mono);
    font-size: 1.85mm;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--color-text-dim);
  }
</style>
</head>
<body>
  <div class="card front" id="card">
    <div class="card__grid"></div>
    <div class="card__glow card__glow--front"></div>

    <div class="card__content front__content">
      <span class="front__mark" aria-hidden="true">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <polygon points="22,22 27,46 41,40" fill="#7df3ff"/>
          <polygon points="78,22 73,46 59,40" fill="#b24bf3"/>
          <polygon points="41,40 50,30 59,40 50,55" fill="#35e6ff"/>
          <polygon points="27,46 41,40 50,55 38,78 24,60" fill="#35e6ff"/>
          <polygon points="73,46 59,40 50,55 62,78 76,60" fill="#b24bf3"/>
          <polygon points="50,55 38,78 50,86 62,78" fill="#7df3ff"/>
          <polygon points="46,80 54,80 50,88" fill="#45f0a6"/>
        </svg>
      </span>

      <div class="front__identity">
        <h1 class="front__name">Samuel&nbsp;Sulo</h1>
        <div class="front__role">
          <span class="front__role-bar"></span>
          <span class="front__role-text">Web Developer &amp; Cloud Engineer</span>
        </div>
      </div>

      <span class="front__watermark">samuelsulo.it</span>
    </div>

    <div class="guide guide--trim" id="guide-trim" hidden></div>
    <div class="guide guide--safe" id="guide-safe" hidden></div>
  </div>
</body>
</html>
