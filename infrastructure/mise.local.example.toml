# Copy to mise.local.toml (git-ignored) and fill in. Values that are not
# secret but that the repository, being public, does not publish.
[env]
# 12-digit ID of the workload-prod account, where production is deployed.
PORTFOLIO_WORKLOAD_PROD_AWS_ACCOUNT_ID = "000000000000"
# 12-digit ID of the sandbox account.
PORTFOLIO_SANDBOX_AWS_ACCOUNT_ID = "000000000000"
# 12-digit ID of the devops account, which holds the state bucket.
PORTFOLIO_STATE_AWS_ACCOUNT_ID = "000000000000"
# 12-digit ID of the network-hub account, which holds the hosted zone.
PORTFOLIO_DNS_AWS_ACCOUNT_ID = "000000000000"
