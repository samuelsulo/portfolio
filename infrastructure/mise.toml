[tools]
opentofu = "1"
terragrunt = "1"
tflint = "latest"
trivy = "latest"

[env]
CATALOG_REPO = "samuelsulo/opentofu-aws-catalog"
# Directory (relative to the stack) where Terragrunt saves plan files
TG_OUT_DIR = ".plans"

[tasks."catalog:list"]
description = "List module versions available in the catalog"
run = "scripts/catalog-list.sh \"$CATALOG_REPO\""

[tasks."catalog:vendor"]
description = "Vendor a module from the catalog"
run = "scripts/catalog-vendor.sh \"$CATALOG_REPO\""

[tasks.lint]
description = "Static checks: tflint and trivy"
run = "scripts/lint.sh"
