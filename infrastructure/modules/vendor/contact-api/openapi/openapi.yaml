openapi: 3.0.1
info:
  title: ${api_gateway_name}
  version: "1.0.0"
paths:
  /email:
    post:
      operationId: ContactViaEmail
      summary: Submit a message from the site's contact form, delivered by email.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ContactViaEmailRequest"
      x-amazon-apigateway-request-validator: validateBody
      responses:
        "202":
          description: >-
            Request accepted: Amazon SES has accepted the
            SendTemplatedEmail call and returned a MessageId. SES sends
            asynchronously, so this only confirms the message was queued
            for delivery, not that it reached the recipient's mailbox.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactViaEmailSuccess"
        "400":
          description: >-
            Invalid request (missing body or fields not conforming to the
            schema), or the send was rejected by Amazon SES. Covers the
            errors documented for SendTemplatedEmail: MessageRejected,
            TemplateDoesNotExist, MailFromDomainNotVerified,
            AccountSendingPaused, ConfigurationSetDoesNotExist,
            ConfigurationSetSendingPaused.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactViaEmailError"
        "500":
          description: Unexpected error communicating with Amazon SES.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContactViaEmailError"
      x-amazon-apigateway-integration:
        type: aws
        httpMethod: POST
        # Action-style ARN (action/SendTemplatedEmail): SES's v2 REST API
        # (SendEmail, JSON) was tried here instead and abandoned. It got
        # as far as executing this integration (unlike v1's own
        # path-style attempt below, which never did), but API Gateway
        # signed the request with the wrong SigV4 service name for that
        # path ("Credential should be scoped to correct service: 'ses'"):
        # the "email" service component (required for CreateDeployment,
        # see below) only gets correctly remapped to "ses" for the
        # recognized v1 Query API actions, not for an arbitrary v2 REST
        # path. Path-style itself (action/SendTemplatedEmail's sibling,
        # path//) was tried too and failed differently, unable to execute
        # its request template at all on a real deployment ("Execution
        # failed due to configuration error: Unable to transform
        # request"), regardless of the template's own content. The
        # service component is "email", not "ses" either way: API
        # Gateway validates it against the service's SDK endpoint prefix
        # (email.<region>.amazonaws.com), not its IAM/ARN prefix (ses:...).
        uri: "arn:aws:apigateway:${aws_region}:email:action/SendTemplatedEmail"
        credentials: "${ses_role_arn}"
        passthroughBehavior: "when_no_templates"
        requestParameters:
          integration.request.header.Content-Type: "'application/x-www-form-urlencoded'"
        requestTemplates:
          application/json: |
            ${indent(12, contact_via_email_request_template)}
        responses:
          default:
            statusCode: "202"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
            responseTemplates:
              application/json: |
                ${indent(16, contact_via_email_response_success_template)}
          "4\\d{2}":
            statusCode: "400"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
            responseTemplates:
              application/json: |
                ${indent(16, contact_via_email_response_client_error_template)}
          "5\\d{2}":
            statusCode: "500"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
            responseTemplates:
              application/json: |
                ${indent(16, contact_via_email_response_server_error_template)}
    options:
      summary: CORS preflight for the ContactViaEmail operation.
      responses:
        "200":
          description: CORS preflight response.
          headers:
            Access-Control-Allow-Origin:
              schema:
                type: string
            Access-Control-Allow-Methods:
              schema:
                type: string
            Access-Control-Allow-Headers:
              schema:
                type: string
          content: {}
      x-amazon-apigateway-integration:
        type: mock
        requestTemplates:
          application/json: '{"statusCode": 200}'
        responses:
          default:
            statusCode: "200"
            responseParameters:
              method.response.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
              method.response.header.Access-Control-Allow-Methods: "'POST,OPTIONS'"
              method.response.header.Access-Control-Allow-Headers: "'Content-Type'"
            responseTemplates:
              application/json: "{}"
components:
  schemas:
    ContactViaEmailRequest:
      type: object
      required:
        - name
        - email
        - message
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 1
          maxLength: 200
          pattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
        phone:
          type: string
          maxLength: 50
        message:
          type: string
          minLength: 1
          maxLength: 5000
    ContactViaEmailSuccess:
      type: object
      required:
        - message
        - messageId
      properties:
        message:
          type: string
        messageId:
          type: string
    # Error shape for both 400 and 500, loosely modeled after RFC 7807
    # (Problem Details for HTTP APIs): a machine-readable code identifying
    # the class of error, plus a human-readable message. A 400 reflects
    # the SES error (code = MessageRejected, TemplateDoesNotExist, ...;
    # message = SES's own description); a 500 uses a fixed code
    # ("InternalError") since it isn't tied to a specific SES error.
    ContactViaEmailError:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
        message:
          type: string
x-amazon-apigateway-request-validators:
  validateBody:
    validateRequestBody: true
    validateRequestParameters: false
# A request that fails validation (or hits API Gateway before reaching any
# integration at all, e.g. an unknown path/method) gets a Gateway
# Response, not one of the "responses" defined above: it never reaches
# the POST /email integration, so its Access-Control-Allow-Origin mapping
# never applies. Without this, such a request looks to the browser like a
# bare CORS failure (no Access-Control-Allow-Origin header at all) instead
# of the actual 4xx/5xx, which is confusing to debug from the frontend.
x-amazon-apigateway-gateway-responses:
  DEFAULT_4XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
    responseTemplates:
      application/json: |
        ${indent(8, gateway_error_template)}
  DEFAULT_5XX:
    responseParameters:
      gatewayresponse.header.Access-Control-Allow-Origin: "'${cors_allowed_origin}'"
    responseTemplates:
      application/json: |
        ${indent(8, gateway_error_template)}
