<!doctype html>
<html lang="en">
  <body style="margin:0;padding:0;background-color:#05060a;font-family:'Space Grotesk','Segoe UI',Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#05060a;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background-color:#10131c;border:1px solid #e6e8f017;border-radius:12px;overflow:hidden;">
            <tr>
              <td style="padding:0;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0">
                  <tr>
                    <td height="3" style="line-height:3px;font-size:0;background-color:#35e6ff;background-image:linear-gradient(90deg,#35e6ff,#b24bf3);">&nbsp;</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:28px 32px 0;">
                <span style="display:inline-block;padding:3px 10px;border:1px solid #35e6ff66;border-radius:999px;color:#35e6ff;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;">New message</span>
              </td>
            </tr>
            <tr>
              <td style="padding:12px 32px 20px;">
                <h1 style="margin:0;color:#e9ebf3;font-size:20px;font-weight:700;letter-spacing:.2px;">You received a new contact from the site</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 24px;">
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;">
                  <tr>
                    <td style="padding:10px 0;border-bottom:1px solid #e6e8f017;width:110px;color:#6b7186;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;vertical-align:top;">Name</td>
                    <td style="padding:10px 0;border-bottom:1px solid #e6e8f017;color:#e9ebf3;font-size:14px;vertical-align:top;">{{name}}</td>
                  </tr>
                  <tr>
                    <td style="padding:10px 0;border-bottom:1px solid #e6e8f017;color:#6b7186;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;vertical-align:top;">Email</td>
                    <td style="padding:10px 0;border-bottom:1px solid #e6e8f017;font-size:14px;vertical-align:top;"><a href="mailto:{{email}}" style="color:#35e6ff;text-decoration:none;">{{email}}</a></td>
                  </tr>
                  <tr>
                    <td style="padding:10px 0;color:#6b7186;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;vertical-align:top;">Phone</td>
                    <td style="padding:10px 0;color:#e9ebf3;font-size:14px;vertical-align:top;">{{phone}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px 28px;">
                <div style="color:#6b7186;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;letter-spacing:.5px;text-transform:uppercase;margin-bottom:8px;">Message</div>
                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#161a26;border-left:3px solid #35e6ff;border-radius:4px;">
                  <tr>
                    <td style="padding:16px;color:#e9ebf3;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:13px;line-height:1.7;white-space:pre-wrap;">{{message}}</td>
                  </tr>
                </table>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px;background-color:#090b12;border-top:1px solid #e6e8f017;">
                <p style="margin:0;color:#6b7186;font-size:12px;line-height:1.6;">Reply directly to this email to contact <span style="color:#a3a9bd;">{{name}}</span>: your mail client's "Reply" is already addressed to <span style="color:#35e6ff;">{{email}}</span>.</p>
              </td>
            </tr>
          </table>
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;">
            <tr>
              <td style="padding:16px 8px 0;color:#6b7186;font-family:'JetBrains Mono',Consolas,'Courier New',monospace;font-size:11px;text-align:center;">$ sent automatically by the site's contact form</td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
